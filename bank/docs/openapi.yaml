          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/office/tariffs:
    get:
      tags: [Операторский офис]
      operationId: listTariffs
      summary: Тарифы
      security:
        - operatorAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Тарифы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/office/tariffs/{code}:
    put:
      tags: [Операторский офис]
      operationId: updateTariff
      summary: Изменить тариф
      description: Новые значения действуют для следующих переводов. Доступно старшему оператору.
      security:
        - operatorAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9_]{2,20}$'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffUpdate'
      responses:
        '200':
          description: Тариф
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/office/notifications:
    get:
      tags: [Операторский офис]
      operationId: listOfficeNotifications
      summary: Журнал уведомлений
      description: СМС и пуш всех клиентов, включая коды входа. Новые первыми.
      security:
        - operatorAuth: []
      parameters:
        - name: phone
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Phone'
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [LOGIN_CODE, TRANSFER_COMPLETED, TRANSFER_RECEIVED]
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [SMS, PUSH]
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeNotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /health:
    get:
      tags: [Справочники]
      operationId: getHealth
      summary: Состояние сервиса
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: База данных недоступна или обработчики событий ещё подключаются
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен клиента из `POST /api/v1/auth/verify`
    operatorAuth:
      type: http
      scheme: bearer
      description: Токен оператора из `POST /api/v1/office/auth/login`
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Сквозной номер запроса. Если не передан, банк назначит свой и вернёт его в заголовке ответа.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,64}$'
    AttemptLabel:
      name: X-Attempt-Label
      in: header
      required: false
      description: Метка попытки. Записывается в журнал запросов банка.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ запроса, например UUID. Одинаковые ключи с одинаковым телом дают одну операцию.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    ClientIdPath:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      required: false
      description: Размер страницы, по умолчанию 20
      schema:
        type: integer
        minimum: 1
        maximum: 100
    PageOffset:
      name: offset
      in: query
      required: false
      description: Сколько записей пропустить, по умолчанию 0
      schema:
        type: integer
        minimum: 0
    OperationIdPath:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateIdPath:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AutopaymentIdPath:
      name: autopaymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Сквозной номер запроса
      schema:
        type: string
  responses:
    BadRequest:
      description: Запрос не прошёл проверку формата
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нет действительного токена или код входа неверен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Действие недоступно клиенту
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Запрос корректен по формату, но выполнить его нельзя
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Состояние объекта не позволяет выполнить действие
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Внутренняя ошибка банка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Phone:
      type: string
      pattern: '^\+79[0-9]{9}$'
      description: Мобильный телефон в формате +79XXXXXXXXX
      examples: ['+79001110001']
    AccountNumber:
      type: string
      pattern: '^[0-9]{20}$'
      description: Номер счёта, 20 цифр
    Money:
      type: integer
      minimum: 0
      maximum: 1000000000000
      description: Сумма в копейках
    Timestamp:
      type: string
      format: date-time
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
    LoginChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, expiresInSec]
      properties:
        challengeId:
          type: string
          format: uuid
        expiresInSec:
          type: integer
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{6}$'
    ClientSummary:
      type: object
      additionalProperties: false
      required: [id, number, fullName]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Номер клиента
        fullName:
          type: string
    AuthToken:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresInSec, client]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresInSec:
          type: integer
        client:
          $ref: '#/components/schemas/ClientSummary'
    Tariff:
      type: object
      additionalProperties: false
      required: [code, name, dailyPhoneTransferLimit, freeMonthlyVolume, commissionRateBps, commissionMin, commissionMax]
      properties:
        code:
          type: string
        name:
          type: string
        dailyPhoneTransferLimit:
          $ref: '#/components/schemas/Money'
        freeMonthlyVolume:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Бесплатный месячный объём переводов в другие банки, в копейках
        commissionRateBps:
          type: integer
          description: Ставка комиссии в сотых долях процента, 100 означает 1 %
        commissionMin:
          $ref: '#/components/schemas/Money'
        commissionMax:
          $ref: '#/components/schemas/Money'
    LimitUsage:
      type: object
      additionalProperties: false
      required: [limit, used, remaining, resetsAt]
      properties:
        limit:
          $ref: '#/components/schemas/Money'
        used:
          $ref: '#/components/schemas/Money'
        remaining:
          $ref: '#/components/schemas/Money'
        resetsAt:
          $ref: '#/components/schemas/Timestamp'
    Limits:
      type: object
      additionalProperties: false
      required: [dailyPhoneTransfer, monthlyFreeVolume]
      properties:
        dailyPhoneTransfer:
          $ref: '#/components/schemas/LimitUsage'
        monthlyFreeVolume:
          allOf:
            - $ref: '#/components/schemas/LimitUsage'
          description: Бесплатный месячный объём переводов в другие банки
    Profile:
      type: object
      additionalProperties: false
      required: [id, number, fullName, phone, kind, resident, tariff, limits]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        fullName:
          type: string
        phone:
          $ref: '#/components/schemas/Phone'
        kind:
          type: string
          enum: [INDIVIDUAL, ENTREPRENEUR]
        resident:
          type: boolean
        tariff:
          $ref: '#/components/schemas/Tariff'
        limits:
          $ref: '#/components/schemas/Limits'
    Card:
      type: object
      additionalProperties: false
      required: [id, maskedNumber, product, holderName, expiry, status]
      properties:
        id:
          type: string
          format: uuid
        maskedNumber:
          type: string
          description: Шесть первых и четыре последние цифры номера карты
        product:
          type: string
        holderName:
          type: string
        expiry:
          type: string
          pattern: '^[0-9]{2}/[0-9]{2}$'
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
    Account:
      type: object
      additionalProperties: false
      required: [id, number, kind, title, currency, status, isPrimary, balance, held, available, openedAt, cards]
      properties:
        id:
          type: string
          format: uuid
        number:
          $ref: '#/components/schemas/AccountNumber'
        kind:
          type: string
          enum: [CURRENT, SAVINGS, SETTLEMENT]
        title:
          type: string
        currency:
          type: string
          const: RUB
        status:
          type: string
          enum: [ACTIVE, ARRESTED, CLOSED]
          description: При аресте счёт принимает деньги, но расходные операции отклоняются
        isPrimary:
          type: boolean
          description: Основной счёт получает переводы по номеру телефона
        balance:
          type: integer
          description: Остаток по проводкам в копейках
        held:
          $ref: '#/components/schemas/Money'
        available:
          type: integer
          description: Остаток за вычетом удержаний, в копейках
        openedAt:
          $ref: '#/components/schemas/Timestamp'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    AccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    StatementEntry:
      type: object
      additionalProperties: false
      required: [id, postedAt, direction, amount, description, operationId, balanceAfter]
      properties:
        id:
          type: integer
        postedAt:
          $ref: '#/components/schemas/Timestamp'
        direction:
          type: string
          enum: [DEBIT, CREDIT]
          description: DEBIT уменьшает остаток счёта клиента, CREDIT увеличивает
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
        operationId:
          type: [string, 'null']
          format: uuid
        balanceAfter:
          type: integer
          description: Остаток счёта после проводки
    Statement:
      type: object
      additionalProperties: false
      required: [accountId, accountNumber, from, to, openingBalance, closingBalance, totalDebit, totalCredit, entries]
      properties:
        accountId:
          type: string
          format: uuid
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        openingBalance:
          type: integer
        closingBalance:
          type: integer
        totalDebit:
          $ref: '#/components/schemas/Money'
        totalCredit:
          $ref: '#/components/schemas/Money'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
    OperationType:
      type: string
      enum: [OWN_TRANSFER, PHONE_TRANSFER]
    OperationStatus:
      type: string
      enum: [CREATED, CHECKING, ON_REVIEW, PROCESSING, COMPLETED, REJECTED, FAILED, REFUNDED]
    OwnTransferRequest:
      type: object
      additionalProperties: false
      required: [type, fromAccount, toAccount, amount]
      properties:
        type:
          type: string
          const: OWN_TRANSFER
        fromAccount:
          $ref: '#/components/schemas/AccountNumber'
        toAccount:
          $ref: '#/components/schemas/AccountNumber'
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000000
          description: Сумма в копейках
        comment:
          type: string
          maxLength: 140
    PhoneTransferRequest:
      type: object
      additionalProperties: false
      required: [type, fromAccount, recipientPhone, amount]
      properties:
        type:
          type: string
          const: PHONE_TRANSFER
        fromAccount:
          $ref: '#/components/schemas/AccountNumber'
        recipientPhone:
          $ref: '#/components/schemas/Phone'
        recipientBankCode:
          type: string
          pattern: '^[A-Z0-9_]{2,20}$'
          description: Код банка получателя из справочника банков. Без него перевод уходит клиенту ЗапускБанка.
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000000
          description: Сумма в копейках
        comment:
          type: string
          maxLength: 140
    TransferRequest:
      oneOf:
        - $ref: '#/components/schemas/OwnTransferRequest'
        - $ref: '#/components/schemas/PhoneTransferRequest'
      discriminator:
        propertyName: type
    AccountRef:
      type: object
      additionalProperties: false
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          $ref: '#/components/schemas/AccountNumber'
    Recipient:
      type: object
      additionalProperties: false
      required: [accountNumber, phone, bankCode, bankName, displayName]
      properties:
        accountNumber:
          type: [string, 'null']
          description: Заполнен в переводе между своими счетами
        phone:
          type: [string, 'null']
        bankCode:
          type: [string, 'null']
        bankName:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
          description: Имя получателя в сокращённом виде
    Rejection:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [DAILY_LIMIT_EXCEEDED, ACCOUNT_ARRESTED, NON_RESIDENT_EXTERNAL_TRANSFER, ANTIFRAUD_REJECTED, OPERATOR_REJECTED, REVIEW_EXPIRED]
        message:
          type: string
    StatusHistoryItem:
      type: object
      additionalProperties: false
      required: [status, at, reasonCode, comment]
      properties:
        status:
          $ref: '#/components/schemas/OperationStatus'
        at:
          $ref: '#/components/schemas/Timestamp'
        reasonCode:
          type: [string, 'null']
          description: Причина перехода, например ANTIFRAUD_REVIEW, SBP_REJECTED, SBP_UNAVAILABLE, SBP_TIMEOUT
        comment:
          type: [string, 'null']
    Operation:
      type: object
      additionalProperties: false
      required: [id, number, type, route, status, amount, fee, total, currency, fromAccount, recipient, comment, rejection, createdAt, updatedAt, completedAt, statusHistory]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Номер операции для обращений
        type:
          $ref: '#/components/schemas/OperationType'
        route:
          type: string
          enum: [INTERNAL, SBP]
          description: INTERNAL — внутри ЗапускБанка, SBP — через учебную систему быстрых платежей
        status:
          $ref: '#/components/schemas/OperationStatus'
        amount:
          type: integer
          description: Сумма перевода в копейках
        fee:
          type: integer
          description: Комиссия в копейках
        total:
          type: integer
          description: Сумма списания с комиссией в копейках
        currency:
          type: string
          const: RUB
        fromAccount:
          $ref: '#/components/schemas/AccountRef'
        recipient:
          $ref: '#/components/schemas/Recipient'
        comment:
          type: [string, 'null']
        templateId:
          type: [string, 'null']
          format: uuid
          x-release: '1.1'
          description: Шаблон, по которому создана операция, `null` у обычных переводов
        rejection:
          anyOf:
            - $ref: '#/components/schemas/Rejection'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          type: [string, 'null']
          format: date-time
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistoryItem'
    OperationPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Bank:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    BankList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bank'
    SmsMessage:
      type: object
      additionalProperties: false
      required: [id, phone, channel, kind, text, createdAt]
      properties:
        id:
          type: integer
        phone:
          $ref: '#/components/schemas/Phone'
        channel:
          type: string
          enum: [SMS, PUSH]
        kind:
          type: string
        text:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    SmsList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SmsMessage'
    ReviewState:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED]
    AntifraudRule:
      type: object
      additionalProperties: false
      required: [code, points, description]
      properties:
        code:
          type: string
          enum: [NEW_RECIPIENT, NIGHT_TIME, AMOUNT_ABOVE_USUAL, HIGH_FREQUENCY]
        points:
          type: integer
        description:
          type: string
    ReviewItem:
      type: object
      additionalProperties: false
      required: [operationId, operationNumber, operationStatus, clientNumber, clientName, type, route, amount, recipient, score, rules, state, createdAt, deadlineAt, resolvedAt, resolvedBy, comment]
      properties:
        operationId:
          type: string
          format: uuid
        operationNumber:
          type: string
        operationStatus:
          $ref: '#/components/schemas/OperationStatus'
        clientNumber:
          type: string
        clientName:
          type: string
        type:
          $ref: '#/components/schemas/OperationType'
        route:
          type: string
          enum: [INTERNAL, SBP]
        amount:
          $ref: '#/components/schemas/Money'
        recipient:
          type: object
          additionalProperties: false
          required: [phone, bankCode, bankName, displayName]
          properties:
            phone:
              type: [string, 'null']
            bankCode:
              type: [string, 'null']
            bankName:
              type: [string, 'null']
            displayName:
              type: [string, 'null']
        score:
          type: integer
          description: Оценка антифрода
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AntifraudRule'
        state:
          $ref: '#/components/schemas/ReviewState'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        deadlineAt:
          $ref: '#/components/schemas/Timestamp'
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolvedBy:
          type: [string, 'null']
        comment:
          type: [string, 'null']
    ReviewPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ApproveReviewRequest:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 500
    RejectReviewRequest:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 3
          maxLength: 500
    RecipientLookup:
      type: object
      additionalProperties: false
      required: [phone, bankCode, bankName, displayName, known]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        bankCode:
          type: string
        bankName:
          type: string
        displayName:
          type: [string, 'null']
          description: Имя получателя в сокращённом виде, если оно известно
        known:
          type: boolean
          description: true, если клиент уже переводил этому получателю
    OperatorRole:
      type: string
      enum: [OPERATOR, SENIOR]
      description: OPERATOR разбирает проверки, SENIOR дополнительно правит тарифы и лимиты
    Operator:
      type: object
      additionalProperties: false
      required: [id, login, fullName, shortName, role]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
        shortName:
          type: string
        role:
          $ref: '#/components/schemas/OperatorRole'
    OperatorLoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    OperatorToken:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresInSec, operator]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresInSec:
          type: integer
        operator:
          $ref: '#/components/schemas/Operator'
    ThresholdPair:
      type: object
      additionalProperties: false
      required: [review, reject]
