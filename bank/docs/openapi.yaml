openapi: 3.1.0
info:
  title: ЗапускБанк API
  version: 1.0.0
  description: |
    Программный интерфейс учебного банка ЗапускБанк платформы «Запускай». Клиенты, счета и операции вымышленные.

    Все суммы передаются целым числом копеек: `150000` означает 1 500 рублей 00 копеек. Валюта операций — рубли.

    Время банка — московское, в ответах оно приходит со смещением `+03:00`. Текущее время банка возвращается в заголовке `X-Bank-Time` каждого ответа. Лимиты считаются по московским суткам и календарному месяцу.

    Вход: `POST /api/v1/auth/login` отправляет код на телефон клиента, `POST /api/v1/auth/verify` меняет код на токен. Токен передаётся заголовком `Authorization: Bearer <токен>`. Код входа приходит СМС-сообщением, прочитать его в учебном контуре можно запросом `GET /api/v1/sandbox/sms`.

    Создание перевода требует заголовок `Idempotency-Key`. Повторный запрос с тем же ключом и тем же телом возвращает ту же операцию, с другим телом — ошибку.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Вход
  - name: Профиль
  - name: Счета
  - name: Переводы
  - name: Операции
  - name: Операторский офис
  - name: Справочники
  - name: Шаблоны
    x-release: '1.1'
  - name: Автоплатежи
    x-release: '1.1'
  - name: Учебный контур
paths:
  /api/v1/auth/login:
    post:
      tags: [Вход]
      operationId: requestLoginCode
      summary: Запросить код входа
      description: Отправляет шестизначный код СМС на телефон клиента. Код действует 5 минут, на ввод даётся 5 попыток. Новый запрос отменяет предыдущий код.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              phone: '+79001110001'
      responses:
        '202':
          description: Код отправлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/verify:
    post:
      tags: [Вход]
      operationId: verifyLoginCode
      summary: Подтвердить код и получить токен
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags: [Вход]
      operationId: logout
      summary: Завершить сеанс
      description: Токен перестаёт действовать сразу.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '204':
          description: Сеанс завершён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/me:
    get:
      tags: [Профиль]
      operationId: getProfile
      summary: Профиль клиента, тариф и использование лимитов
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/accounts:
    get:
      tags: [Счета]
      operationId: listAccounts
      summary: Счета клиента с картами
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Список счетов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/accounts/{accountId}:
    get:
      tags: [Счета]
      operationId: getAccount
      summary: Один счёт клиента
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Счёт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/accounts/{accountId}/statement:
    get:
      tags: [Счета]
      operationId: getStatement
      summary: Выписка по счёту за период
      description: Проводки счёта за период по московским датам, обе границы включительно. Без параметров — с начала текущего месяца по сегодня. Остаток на начало и на конец считаются по проводкам.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: from
          in: query
          required: false
          description: Первый день периода
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Последний день периода
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Выписка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/transfers:
    post:
      tags: [Переводы]
      operationId: createTransfer
      summary: Создать перевод
      description: |
        Два вида перевода: между своими счетами (`OWN_TRANSFER`) и по номеру телефона (`PHONE_TRANSFER`). Перевод по телефону уходит клиенту ЗапускБанка, а при указании `recipientBankCode` другого банка — в другой банк.

        Перевод между своими счетами проходит без комиссии и лимитов. Перевод по телефону подчиняется суточному лимиту тарифа клиента. Комиссия берётся только с переводов в другой банк: бесплатный месячный объём считается по ним, сверх него — процент тарифа с минимумом и максимумом. Переводы внутри ЗапускБанка комиссии не облагаются.

        Отказ по правилам банка (лимит, арест счёта, запрет для нерезидента) создаёт операцию со статусом `REJECTED` и причиной в поле `rejection`. Ошибки данных (нет получателя, не хватает средств) возвращаются ответом 422 без операции.

        Перевод между своими счетами проводится сразу. Перевод по телефону обрабатывается асинхронно: ответ приходит со статусом `CHECKING`, затем операция проходит проверку антифродом и, если нужно, ручную проверку (`ON_REVIEW`, срок 30 минут), после чего становится `PROCESSING` и заканчивается статусом `COMPLETED`. Перевод в другой банк после `PROCESSING` ждёт ответа системы быстрых платежей и может завершиться статусами `FAILED` (банк получателя отказал или система недоступна) и `REFUNDED` (система не ответила, деньги возвращены). Итоговый статус смотрите запросом `GET /api/v1/operations/{operationId}`.

        Средства на время проверки и обработки удерживаются на счёте: остаток `balance` не меняется, `available` уменьшается на сумму перевода и комиссии.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            examples:
              byPhone:
                summary: Перевод по телефону
                value:
                  type: PHONE_TRANSFER
                  fromAccount: '40817810800000001000'
                  recipientPhone: '+79001110002'
                  amount: 150000
                  comment: За обед
              ownAccounts:
                summary: Между своими счетами
                value:
                  type: OWN_TRANSFER
                  fromAccount: '40817810800000001000'
                  toAccount: '40817810100000001001'
                  amount: 500000
      responses:
        '201':
          description: Операция создана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '200':
          description: Повтор запроса с тем же ключом и телом, возвращена ранее созданная операция
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              description: Всегда `true`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/operations:
    get:
      tags: [Операции]
      operationId: listOperations
      summary: История операций клиента
      description: Операции от новых к старым. Даты фильтра — московские, обе границы включительно.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OperationStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OperationType'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: number
          in: query
          required: false
          description: Номер операции целиком
          schema:
            type: string
            maxLength: 32
        - name: limit
          in: query
          required: false
          description: Размер страницы, по умолчанию 20
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Сколько операций пропустить, по умолчанию 0
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Страница операций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/operations/{operationId}:
    get:
      tags: [Операции]
      operationId: getOperation
      summary: Операция с историей статусов
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Операция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/templates:
    get:
      tags: [Шаблоны]
      operationId: listTemplates
      x-release: '1.1'
      summary: Шаблоны переводов клиента
      description: Шаблоны в порядке создания. У клиента может быть не больше 20 шаблонов.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Шаблоны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Шаблоны]
      operationId: createTemplate
      x-release: '1.1'
      summary: Создать шаблон
      description: |
        Шаблон создаётся двумя способами: из выполненной операции клиента (`fromOperationId`) или вручную (`kind`, `fromAccount` и данные получателя). Название обязательно в обоих случаях.

        Вид `PHONE` — перевод клиенту ЗапускБанка по телефону, `SBP` — перевод в другой банк (нужен `recipientBankCode` из справочника банков), `OWN` — перевод между своими счетами (нужен `toAccount`). Сумма в шаблоне необязательна. У шаблона, созданного из операции, сумма и сообщение берутся из операции.

        Название — от 1 до 40 символов, без повторов у клиента (регистр не учитывается). Отказы: `TEMPLATE_LIMIT_REACHED` — уже 20 шаблонов, `TEMPLATE_NAME_TAKEN` — название занято, `OPERATION_NOT_FOUND` — операции нет среди операций клиента, `OPERATION_NOT_COMPLETED` — операция не выполнена.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
            examples:
              fromOperation:
                summary: Из выполненной операции
                value:
                  name: Аренда
                  fromOperationId: 0b2f4a5e-1c3d-4e5f-8a9b-0c1d2e3f4a5b
              manual:
                summary: Вручную
                value:
                  name: Маме
                  kind: PHONE
                  fromAccount: '40817810800000001000'
                  recipientPhone: '+79001110002'
                  amount: 500000
      responses:
        '201':
          description: Шаблон создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/templates/{templateId}:
    patch:
      tags: [Шаблоны]
      operationId: updateTemplate
      x-release: '1.1'
      summary: Изменить шаблон
      description: |
        Меняет название, сумму, сообщение и счёт списания. Сумма `null` убирает сумму из шаблона. Получателя изменить нельзя: создайте новый шаблон. Отказы те же, что при создании: `TEMPLATE_NAME_TAKEN`, `TEMPLATE_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/TemplateIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
      responses:
        '200':
          description: Шаблон после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Шаблоны]
      operationId: deleteTemplate
      x-release: '1.1'
      summary: Удалить шаблон
      description: Операции, созданные по шаблону, остаются в истории. Если по шаблону есть действующий автоплатёж, удаление отклоняется кодом `TEMPLATE_IN_USE`.
      parameters:
        - $ref: '#/components/parameters/TemplateIdPath'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '204':
          description: Шаблон удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/templates/{templateId}/transfers:
    post:
      tags: [Шаблоны]
      operationId: createTemplateTransfer
      x-release: '1.1'
      summary: Перевод по шаблону
      description: |
        Создаёт обычную операцию своего вида с полем `templateId`. Перевод проходит те же проверки, что и перевод через `POST /api/v1/transfers`: суточный лимит, комиссию, антифрод и ручную проверку. Заголовок `Idempotency-Key` обязателен и работает так же.

        Сумма в запросе заменяет сумму шаблона. Если суммы нет ни в шаблоне, ни в запросе, банк отвечает `AMOUNT_REQUIRED`. Сообщение в запросе заменяет сообщение шаблона.
      parameters:
        - $ref: '#/components/parameters/TemplateIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateTransferRequest'
      responses:
        '201':
          description: Операция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '200':
          description: Повтор запроса с тем же ключом и телом, возвращена ранее созданная операция
          headers:
            Idempotent-Replayed:
              description: Всегда `true`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/autopayments:
    get:
      tags: [Автоплатежи]
      operationId: listAutopayments
      x-release: '1.1'
      summary: Автоплатежи клиента
      description: Все автоплатежи клиента, новые первыми, включая завершённые.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      responses:
        '200':
          description: Автоплатежи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutopaymentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Автоплатежи]
      operationId: createAutopayment
      x-release: '1.1'
      summary: Создать автоплатёж
      description: |
        Автоплатёж создаётся по шаблону: день месяца от 1 до 28, сумма (нужна, если её нет в шаблоне; сумма в запросе заменяет сумму шаблона) и необязательная дата окончания включительно.

        Платёж исполняется в день месяца в 10:00 по времени банка. Если создать автоплатёж в его день до 10:00, первый платёж пройдёт сегодня, после 10:00 — в следующем месяце. Отказы: `TEMPLATE_NOT_FOUND`, `AMOUNT_REQUIRED`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AttemptLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutopaymentRequest'
            example:
