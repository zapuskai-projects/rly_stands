name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: zapuskai-projects

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия тега совпадает с VERSION
        run: |
          expected="v$(tr -d ' \r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с VERSION ($expected)" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Зеркало сторонних образов
        run: |
          while read -r source target; do
            case "$source" in ''|'#'*) continue ;; esac
            docker buildx imagetools create --tag "$REGISTRY/$OWNER/mirror/$target" "$source"
          done < images/mirror.txt

      - name: Версия образов
        id: version
        run: echo "value=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Пульт
        uses: docker/build-push-action@v6
        with:
          context: pult
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/stands-kit-pult:${{ steps.version.outputs.value }}

      - name: Linux-сервер для тестировщика
        uses: docker/build-push-action@v6
        with:
          context: images/linux-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/stands-kit-linux:${{ steps.version.outputs.value }}

      - name: Учебный банк
        uses: docker/build-push-action@v6
        with:
          context: bank
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/stands-kit-bank:${{ steps.version.outputs.value }}
