        review:
          type: integer
        reject:
          type: integer
    ReviewClient:
      type: object
      additionalProperties: false
      required: [number, fullName, kind, resident, customerSince, tariffName, usualAmount, accountNumber]
      properties:
        number:
          type: string
        fullName:
          type: string
        kind:
          type: string
          enum: [INDIVIDUAL, ENTREPRENEUR]
        resident:
          type: boolean
        customerSince:
          $ref: '#/components/schemas/Timestamp'
        tariffName:
          type: string
        usualAmount:
          type: [integer, 'null']
          description: Средняя сумма прежних переводов по телефону в копейках, null если переводов не было
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
    ReviewDetails:
      type: object
      additionalProperties: false
      required: [review, client, thresholds, recentOperations]
      properties:
        review:
          $ref: '#/components/schemas/ReviewItem'
        client:
          $ref: '#/components/schemas/ReviewClient'
        thresholds:
          $ref: '#/components/schemas/ThresholdPair'
        recentOperations:
          type: array
          items:
            $ref: '#/components/schemas/OfficeOperationRow'
    OfficeOperationRow:
      type: object
      additionalProperties: false
      required: [id, number, clientNumber, clientName, type, route, status, amount, fee, recipient, createdAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        clientNumber:
          type: string
        clientName:
          type: string
        type:
          $ref: '#/components/schemas/OperationType'
        route:
          type: string
          enum: [INTERNAL, SBP]
        status:
          $ref: '#/components/schemas/OperationStatus'
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        recipient:
          type: object
          additionalProperties: false
          required: [phone, bankCode, bankName, displayName]
          properties:
            phone:
              type: [string, 'null']
            bankCode:
              type: [string, 'null']
            bankName:
              type: [string, 'null']
            displayName:
              type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    OfficeOperationPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfficeOperationRow'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    AntifraudResult:
      type: object
      additionalProperties: false
      required: [score, decision, rules, thresholds, decidedAt]
      properties:
        score:
          type: integer
        decision:
          type: string
          enum: [APPROVE, REVIEW, REJECT]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AntifraudRule'
        thresholds:
          $ref: '#/components/schemas/ThresholdPair'
        decidedAt:
          $ref: '#/components/schemas/Timestamp'
    OfficeOperation:
      type: object
      additionalProperties: false
      required: [operation, client, antifraud, review]
      properties:
        operation:
          $ref: '#/components/schemas/Operation'
        client:
          type: object
          additionalProperties: false
          required: [number, fullName]
          properties:
            number:
              type: string
            fullName:
              type: string
        antifraud:
          anyOf:
            - $ref: '#/components/schemas/AntifraudResult'
            - type: 'null'
        review:
          anyOf:
            - $ref: '#/components/schemas/ReviewItem'
            - type: 'null'
    OfficeClient:
      type: object
      additionalProperties: false
      required: [id, number, fullName, phone, kind, resident, inn, status, tariff, customerSince, accountsCount, totalBalance]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        fullName:
          type: string
        phone:
          $ref: '#/components/schemas/Phone'
        kind:
          type: string
          enum: [INDIVIDUAL, ENTREPRENEUR]
        resident:
          type: boolean
        inn:
          type: [string, 'null']
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
        tariff:
          type: object
          additionalProperties: false
          required: [code, name]
          properties:
            code:
              type: string
            name:
              type: string
        customerSince:
          $ref: '#/components/schemas/Timestamp'
        accountsCount:
          type: integer
        totalBalance:
          type: integer
          description: Остаток по всем счетам клиента в копейках
    OfficeClientPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfficeClient'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    OfficeAccount:
      type: object
      additionalProperties: false
      required: [id, number, kind, title, status, balance, held, available]
      properties:
        id:
          type: string
          format: uuid
        number:
          $ref: '#/components/schemas/AccountNumber'
        kind:
          type: string
          enum: [CURRENT, SAVINGS, SETTLEMENT]
        title:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARRESTED, CLOSED]
        balance:
          type: integer
        held:
          $ref: '#/components/schemas/Money'
        available:
          type: integer
    OfficeClientDetails:
      type: object
      additionalProperties: false
      required: [client, accounts, tariff, limits, dailyLimitOverride, recentOperations]
      properties:
        client:
          $ref: '#/components/schemas/OfficeClient'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/OfficeAccount'
        tariff:
          $ref: '#/components/schemas/Tariff'
        limits:
          $ref: '#/components/schemas/Limits'
        dailyLimitOverride:
          type: [integer, 'null']
          description: Личный суточный лимит в копейках, null если действует лимит тарифа
        recentOperations:
          type: array
          items:
            $ref: '#/components/schemas/OfficeOperationRow'
    DailyLimitUpdate:
      type: object
      additionalProperties: false
      required: [dailyPhoneTransferLimit]
      properties:
        dailyPhoneTransferLimit:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000000000
          description: Новый личный лимит в копейках или null
    TariffList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tariff'
    TariffUpdate:
      type: object
      additionalProperties: false
      required: [dailyPhoneTransferLimit, freeMonthlyVolume, commissionRateBps, commissionMin, commissionMax]
      properties:
        dailyPhoneTransferLimit:
          $ref: '#/components/schemas/Money'
        freeMonthlyVolume:
          $ref: '#/components/schemas/Money'
        commissionRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        commissionMin:
          $ref: '#/components/schemas/Money'
        commissionMax:
          $ref: '#/components/schemas/Money'
    OfficeNotification:
      type: object
      additionalProperties: false
      required: [id, phone, clientName, channel, kind, text, operationNumber, createdAt]
      properties:
        id:
          type: integer
        phone:
          $ref: '#/components/schemas/Phone'
        clientName:
          type: [string, 'null']
        channel:
          type: string
          enum: [SMS, PUSH]
        kind:
          type: string
        text:
          type: string
        operationNumber:
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    OfficeNotificationPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfficeNotification'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    TemplateKind:
      type: string
      enum: [PHONE, OWN, SBP]
      description: PHONE — клиенту ЗапускБанка по телефону, OWN — между своими счетами, SBP — в другой банк по телефону
    Date:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Дата без времени, московская, вида 2026-12-31
    Template:
      type: object
      additionalProperties: false
      required: [id, name, kind, fromAccount, toAccount, recipientPhone, recipientBankCode, recipientBankName, amount, comment, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        kind:
          $ref: '#/components/schemas/TemplateKind'
        fromAccount:
          $ref: '#/components/schemas/AccountNumber'
        toAccount:
          type: [string, 'null']
          description: Счёт зачисления, заполнен для вида `OWN`
        recipientPhone:
          type: [string, 'null']
        recipientBankCode:
          type: [string, 'null']
        recipientBankName:
          type: [string, 'null']
        amount:
          type: [integer, 'null']
          description: Сумма в копейках или `null`, если сумма указывается при переводе
        comment:
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    TemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: Либо `fromOperationId`, либо `kind`, `fromAccount` и данные получателя.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        fromOperationId:
          type: string
          format: uuid
          description: Выполненная операция клиента, из которой берутся вид, счёт, получатель, сумма и сообщение
        kind:
          $ref: '#/components/schemas/TemplateKind'
        fromAccount:
          $ref: '#/components/schemas/AccountNumber'
        toAccount:
          $ref: '#/components/schemas/AccountNumber'
        recipientPhone:
          $ref: '#/components/schemas/Phone'
        recipientBankCode:
          type: string
          pattern: '^[A-Z0-9_]{2,20}$'
          description: Код банка получателя из справочника банков, нужен для вида `SBP`
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000000
          description: Сумма в копейках
        comment:
          type: string
          maxLength: 140
    UpdateTemplateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        fromAccount:
          $ref: '#/components/schemas/AccountNumber'
        amount:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000000000
          description: Сумма в копейках, `null` убирает сумму
        comment:
          type: [string, 'null']
          maxLength: 140
    TemplateTransferRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000000
          description: Сумма в копейках, заменяет сумму шаблона
        comment:
          type: string
          maxLength: 140
    AutopaymentStatus:
      type: string
      enum: [ACTIVE, PAUSED, FAILED, FINISHED]
      description: ACTIVE — действует, PAUSED — на паузе, FAILED — остановлен после неудачи, FINISHED — отменён или закончился
    Autopayment:
      type: object
      additionalProperties: false
      required: [id, templateId, templateName, status, dayOfMonth, amount, endsOn, nextRunOn, attempt, failureReason, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        templateName:
          type: string
        status:
          $ref: '#/components/schemas/AutopaymentStatus'
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
        amount:
          type: integer
          description: Сумма платежа в копейках
        endsOn:
          anyOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
          description: Последний день, когда платёж ещё исполняется
        nextRunOn:
          anyOf:
            - $ref: '#/components/schemas/Date'
            - type: 'null'
          description: Дата ближайшей попытки, `null` у остановленного и завершённого
        attempt:
          type: integer
          minimum: 0
          maximum: 3
          description: Сколько попыток текущего платежа уже сделано
        failureReason:
          type: [string, 'null']
          description: Причина последней неудачи, например INSUFFICIENT_FUNDS
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    AutopaymentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Autopayment'
    CreateAutopaymentRequest:
      type: object
      additionalProperties: false
      required: [templateId, dayOfMonth]
      properties:
        templateId:
          type: string
          format: uuid
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000000
          description: Сумма в копейках. Нужна, если её нет в шаблоне; заменяет сумму шаблона
        endsOn:
          $ref: '#/components/schemas/Date'
    AutopaymentRunOutcome:
      type: string
      enum: [PENDING, EXECUTED, FAILED]
      description: PENDING — операция ещё проверяется, EXECUTED — перевод выполнен, FAILED — перевод не выполнен
    AutopaymentRun:
      type: object
      additionalProperties: false
      required: [id, autopaymentId, runDate, cycleDate, attempt, outcome, operationId, operationNumber, reasonCode, amount, startedAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        autopaymentId:
          type: string
          format: uuid
        runDate:
          $ref: '#/components/schemas/Date'
          description: Дата попытки
        cycleDate:
          $ref: '#/components/schemas/Date'
          description: Дата платежа, к которому относится попытка; у повторов она та же, что у первой попытки
        attempt:
          type: integer
          minimum: 1
          maximum: 3
        outcome:
          $ref: '#/components/schemas/AutopaymentRunOutcome'
        operationId:
          type: [string, 'null']
          format: uuid
          description: Операция перевода, пусто, если банк отказал до создания операции
        operationNumber:
          type: [string, 'null']
        reasonCode:
          type: [string, 'null']
          description: Причина неудачи, например INSUFFICIENT_FUNDS, DAILY_LIMIT_EXCEEDED, ACCOUNT_ARRESTED, ANTIFRAUD_REJECTED, OPERATOR_REJECTED
        amount:
          type: integer
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        finishedAt:
          type: [string, 'null']
          format: date-time
    AutopaymentRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AutopaymentRun'
    AutopaymentRunResult:
      type: object
      additionalProperties: false
      required: [run, autopayment]
      properties:
        run:
          $ref: '#/components/schemas/AutopaymentRun'
        autopayment:
          $ref: '#/components/schemas/Autopayment'
    OfficeAutopayment:
      type: object
      additionalProperties: false
      required: [autopayment, runs]
      properties:
        autopayment:
          $ref: '#/components/schemas/Autopayment'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/AutopaymentRun'
    OfficeAutopaymentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfficeAutopayment'
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        database:
          type: string
          enum: [UP, DOWN]
        release:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Версия банка
          example: '1.0'
